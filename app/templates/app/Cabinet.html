{% extends "app/layout.html" %}

{% block content %}

<div class="container mt-5">
    <h1>Личный кабинет</h1>
    <div class="row">
        <div class="col-md-9">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Информация о профиле</h4>
                    <p class="card-text">Логин: {{ user.username }}</p>
                    <p class="card-text">Имя: {{ user.first_name }} {{ user.last_name }}</p>
                    <p class="card-text">Email: {{ user.email }}</p>
                    <a href="" class="btn btn-primary">Редактировать профиль</a>
                    <a href="" class="btn btn-primary">Сменить пароль</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
