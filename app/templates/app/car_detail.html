{% extends "app/layout.html" %}
{% load static %}


{% block content %}
<div class="container mt-5">
    <h1>{{ car.brand }} {{ car.model }} ({{ car.year }})</h1>
    <div class="row">
        <div class="col-md-6">
            <img src="{{ car.image.url }}" style="width:600px; height:auto" alt="{{ car.brand }} {{ car.model }}" class="img-fluid">
        </div>
        <div class="col-md-6">
            <p><strong>Марка:</strong> {{ car.brand }}</p>
            <p><strong>Модель:</strong> {{ car.model }}</p>
            <p><strong>Год производства:</strong> {{ car.year }}</p>
            <p><strong>Состояние:</strong> {{ car.get_condition_display }}</p>
            <p><strong>Цена:</strong> {{ car.price }}</p>
            
        </div>
        
    </div>
</div>
{% endblock %}
