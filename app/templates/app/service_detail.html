{% extends "app/layout.html" %}

{% block content %}
<div class="container mt-5">
    <h1>{{ service.name }}</h1>
    <div class="row">
        <div class="col-md-12">
            <p><strong>Описание:</strong> {{ service.description }}</p>
            <p><strong>Цена:</strong> {{ service.price }}</p>
            {% if request.user.is_staff %}
            <a href="{% url 'edit_service' service.id %}" class="btn btn-primary">Изменить</a>
            {% endif %}
            {% if request.user.is_staff %}
            <form action="{% url 'delete_service' service.id %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
            </form>
            {% endif %}
        </div>
    </div>
    <a href="../" class="btn btn-primary">В каталог</a>
</div>
{% endblock %}
